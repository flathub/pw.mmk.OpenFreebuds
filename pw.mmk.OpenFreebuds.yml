id: pw.mmk.OpenFreebuds
command: openfreebuds_qt

sdk: org.kde.Sdk
runtime: org.kde.Platform
base: com.riverbankcomputing.PyQt.BaseApp
runtime-version: '6.11'
base-version: '6.11'

finish-args:
  # Connect to Bluetooth devices through RFCOMM / SPP protocol
  - --allow=bluetooth
  - --share=network
  # Display user interface
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # List paired Bluetooth devices, toggle their connection status
  - --system-talk-name=org.bluez
  # Display tray icon
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: python3_extras
    buildsystem: simple
    build-commands:
      - tar xzf just.tar.gz just && install just /app/bin
    sources:
      - type: file
        url: https://github.com/casey/just/releases/download/1.57.0/just-1.57.0-aarch64-unknown-linux-musl.tar.gz
        sha256: f225044a81adea6e0b3a8b9370aaf374e6af76c8735ae263ac993df55fd137ec
        dest-filename: just.tar.gz
        only-arches:
          - aarch64
      - type: file
        url: https://github.com/casey/just/releases/download/1.57.0/just-1.57.0-x86_64-unknown-linux-musl.tar.gz
        sha256: 45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155
        dest-filename: just.tar.gz
        only-arches:
          - x86_64

  - python3-requirements.json

  - name: openfreebuds
    buildsystem: simple
    build-commands:
      - just internal_flatpakinstall
      - rm -rf /app/bin/just justfile dist
    sources:
      - type: file
        url: https://raw.githubusercontent.com/melianmiko/OpenFreebuds/refs/tags/v0.18.0/justfile
        sha256: 7887a43c4204cbaaa567eec31a4d191f871e8f4629617a61a9b6963429ba3340
      - type: file
        url: https://github.com/melianmiko/OpenFreebuds/releases/download/v0.18.0/openfreebuds-0.18.0-py3-none-any.whl
        sha256: 808920aeeecad84434e181630c1d985695d72f58c60f942fb4e08dc03e2802d9
        dest: ./dist

